name: CI

on: [push, pull_request]

jobs:
  corriges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      # On teste les corriges : si ca casse, c'est le test ou le corrige qui est faux.
      - run: python outils/pytest_corrige.py
      - run: ruff check .
